# Every day: an issue for every community plugin on npm that waits for its
# review. See bin/community.mjs.
name: Community plugins

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node bin/community.mjs
        env:
          GH_TOKEN: ${{ github.token }}
