# What every push is held to: the budgets, the types, and a site that builds.
name: Check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run size
      - run: npm run types
      - run: npm ci --prefix site
      - run: npm run build --prefix site
