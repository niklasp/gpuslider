<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>shaderslide: loading</title>
<script>
	// ?from=dist tests what is built for the pages of others.
	window.from = new URLSearchParams( location.search ).get( 'from' ) || 'src';
	for ( const name of [ 'style', 'loading' ] ) {
		document.write(
			`<link rel="stylesheet" href="../${ window.from }/${ name }.css">`
		);
	}
</script>
<style>
	body { margin: 0; }
	.ss { width: 600px; margin: 20px; }
	.ss-slide { height: 200px; }
	#own { position: fixed; inset: auto 0 0; height: 40px; background: #000; color: #fff; }
</style>
</head>
<body>
<div class="ss" id="one" aria-label="One"><div class="ss-track"></div></div>
<div class="ss" id="two" aria-label="Two"><div class="ss-track"></div></div>
<div id="own"><span data-ss-loaded></span></div>
<script type="module">
	/*
	 * Two sliders that are made when the test says so. The media of `one`
	 * are three images, those of `two` an image and a video; what their
	 * addresses have after `?` is for the test to hold them back.
	 */
	const from = `../${ window.from }`;
	const { createSlider } = await import( `${ from }/index.js` );
	const { loading } = await import(
		`${ from }/plugins${ from === '../src' ? '/index' : '' }.js`
	);
	const fill = ( id, media ) => {
		document.querySelector( `#${ id } .ss-track` ).innerHTML = media
			.map( ( one ) => `<div class="ss-slide">${ one }</div>` )
			.join( '' );
	};
	const image = ( n, more = '' ) =>
		`<img class="ss-media" src="../media/${ n }.jpg?held=${ n }" alt="" ${ more }>`;
	fill( 'one', [ image( 1 ), image( 2 ), image( 3, 'loading="lazy"' ) ] );
	fill( 'two', [
		image( 4 ),
		'<video class="ss-media" src="../media/a.mp4?held=a" muted playsinline preload="none"></video>',
	] );

	window.heard = [];
	window.sliders = {};
	window.loading = loading;
	/**
	 * @param {string}   id      Which.
	 * @param {Function} plugin  The plugin.
	 * @return {Object} The slider.
	 */
	window.make = ( id, plugin ) => {
		const slider = createSlider( document.getElementById( id ), {
			plugins: [ plugin ],
			on: {
				'*': ( name, detail ) => {
					if ( name.startsWith( 'loading:' ) ) {
						const { media, ...said } = detail;
						window.heard.push( [ id, name, said ] );
					}
				},
			},
		} );
		window.sliders[ id ] = slider;
		return slider;
	};
	window.ready = true;
</script>
</body>
</html>
