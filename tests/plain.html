<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>shaderslide without the script</title>
<link rel="stylesheet" href="../src/style.css">
<style>
	body { margin: 0; }
	.ss { width: 800px; margin: 40px 100px; --ss-per-view: 2.5; --ss-gap: 12px; }
	.ss-slide { height: 300px; }
</style>
</head>
<body>
<!-- A slider as a page has it, and no script: the first of the three tiers. -->
<div class="ss" id="several" aria-label="Several per view">
	<div class="ss-track">
		<div class="ss-slide"><img class="ss-media" src="../media/1.jpg" alt="One"></div>
		<div class="ss-slide"><img class="ss-media" src="../media/2.jpg" alt="Two"></div>
		<div class="ss-slide"><img class="ss-media" src="../media/3.jpg" alt="Three"></div>
		<div class="ss-slide"><img class="ss-media" src="../media/4.jpg" alt="Four"></div>
		<div class="ss-slide"><img class="ss-media" src="../media/5.jpg" alt="Five"></div>
		<div class="ss-slide"><img class="ss-media" src="../media/6.jpg" alt="Six"></div>
	</div>
</div>
</body>
</html>
