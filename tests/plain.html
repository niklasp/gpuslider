<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gpu slider without the script</title>
<link rel="stylesheet" href="../src/style.css">
<style>
	body { margin: 0; }
	.gs { width: 800px; margin: 40px 100px; --gs-per-view: 2.5; --gs-gap: 12px; }
	.gs-slide { height: 300px; }
</style>
</head>
<body>
<!-- A slider as a page has it, and no script: the first of the three tiers. -->
<div class="gs" id="several" aria-label="Several per view">
	<div class="gs-track">
		<div class="gs-slide"><img class="gs-media" src="../media/1.jpg" alt="One"></div>
		<div class="gs-slide"><img class="gs-media" src="../media/2.jpg" alt="Two"></div>
		<div class="gs-slide"><img class="gs-media" src="../media/3.jpg" alt="Three"></div>
		<div class="gs-slide"><img class="gs-media" src="../media/4.jpg" alt="Four"></div>
		<div class="gs-slide"><img class="gs-media" src="../media/5.jpg" alt="Five"></div>
		<div class="gs-slide"><img class="gs-media" src="../media/6.jpg" alt="Six"></div>
	</div>
</div>
<!-- A stack that is said in the HTML: it is one before the script is. -->
<div class="gs gs-stack" id="stacked" aria-label="One at a time" style="--gs-per-view: 1">
	<div class="gs-track">
		<div class="gs-slide"><img class="gs-media" src="../media/1.jpg" alt="One"></div>
		<div class="gs-slide"><img class="gs-media" src="../media/2.jpg" alt="Two"></div>
		<div class="gs-slide"><img class="gs-media" src="../media/3.jpg" alt="Three"></div>
	</div>
</div>
<!-- And one whose images wait for their place. -->
<div class="gs gs-stack" id="waits" aria-label="One at a time, the others wait" style="--gs-per-view: 1">
	<div class="gs-track">
		<div class="gs-slide"><img class="gs-media" src="../media/1.jpg?waits" alt="One" loading="lazy"></div>
		<div class="gs-slide"><img class="gs-media" src="../media/2.jpg?waits" alt="Two" loading="lazy"></div>
		<div class="gs-slide"><img class="gs-media" src="../media/3.jpg?waits" alt="Three" loading="lazy"></div>
		<div class="gs-slide"><img class="gs-media" src="../media/4.jpg?waits" alt="Four" loading="lazy"></div>
		<div class="gs-slide"><img class="gs-media" src="../media/5.jpg?waits" alt="Five" loading="lazy"></div>
	</div>
</div>
</body>
</html>
