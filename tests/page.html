<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>shaderslide test page</title>
<link rel="stylesheet" href="../src/style.css">
<style>
	body { margin: 0; }
	.ss { width: 800px; margin: 40px 100px; }
	.ss-slide { height: 300px; }
	.ss-content { padding: 20px; color: #fff; }
	.tall { height: 2000px; }
</style>
<style id="extra"></style>
</head>
<body>
<div class="ss" id="slider" aria-label="Test">
	<div class="ss-track"></div>
	<button data-ss-prev>Previous</button>
	<button data-ss-next>Next</button>
	<button data-ss-pause>Pause</button>
	<div data-ss-dots></div>
</div>
<nav id="outside" data-ss-for="slider">
	<button data-ss-prev>Back</button>
	<button data-ss-next>On</button>
	<button data-ss-to="3">To the fourth</button>
</nav>
<button id="lonely">On, by option</button>
<div class="tall"></div>
<script type="module">
	/*
	 * The page of the tests, set up by its address:
	 *
	 *     ?n=5            number of slides
	 *     &o={…}          slider options, JSON
	 *     &css=…          extra styles
	 *     &dir=rtl        reading direction
	 *     &plugins=gl     plugins, by name
	 *     &core=1         the core alone, with the plugins that are named
	 *     &video=1,3      slides that are videos
	 *     &heights=1      slides as high as their media
	 *     &open=500       time the lightbox takes to open, ms
	 */
	const query = new URLSearchParams( location.search );
	const n = Number( query.get( 'n' ) ) || 5;
	document.getElementById( 'extra' ).textContent = query.get( 'css' ) || '';
	if ( query.get( 'dir' ) ) {
		document.documentElement.dir = query.get( 'dir' );
	}
	const track = document.querySelector( '.ss-track' );
	const videos = ( query.get( 'video' ) || '' ).split( ',' );
	if ( query.get( 'heights' ) ) {
		document.getElementById( 'extra' ).textContent +=
			'.ss-slide { height: auto; }';
	}
	for ( let i = 0; i < n; i++ ) {
		const media = videos.includes( String( i ) )
			? `<video class="ss-media" src="../demo/media/${ i % 2 ? 'a' : 'b' }.mp4" muted playsinline loop autoplay></video>`
			: `<img class="ss-media" src="../demo/media/${ ( i % 8 ) + 1 }.jpg" alt="Slide ${ i + 1 }">`;
		track.insertAdjacentHTML(
			'beforeend',
			`<div class="ss-slide" data-i="${ i }">
				${ media }
				<div class="ss-content"><a href="#followed">Link ${ i + 1 }</a></div>
			</div>`
		);
	}
	const core = await import( '../src/index.js' );
	const full = await import( '../src/full.js' );
	const { createSlider } = query.get( 'core' ) ? core : full;
	const canvas = await import( '../src/gl/index.js' );
	const { lightbox } = await import( '../src/lightbox.js' );
	const others = await import( '../src/plugins/index.js' );
	window.lib = { createSlider, core, lightbox, ...canvas, ...others };
	const options = JSON.parse( query.get( 'o' ) || '{}' );
	const names = ( query.get( 'plugins' ) || '' ).split( ',' ).filter( Boolean );
	if ( names.length ) {
		// Effects by name, with their parameters: warp, lens:{"size":0.3}
		const effects = ( query.get( 'effects' ) || '' )
			.split( ';' )
			.filter( Boolean )
			.map( ( effect ) => {
				const [ name, ...rest ] = effect.split( ':' );
				return canvas[ name ](
					rest.length ? JSON.parse( rest.join( ':' ) ) : undefined
				);
			} );
		options.plugins = names.map( ( name ) =>
			name === 'lightbox'
				? lightbox( {
						effects,
						duration: Number( query.get( 'open' ) ) || 500,
						canvas: { preserve: true },
				  } )
				: name === 'gl'
				? canvas.gl( { effects, preserve: true } )
				: others[ name ]()
		);
	}
	window.events = [];
	window.slider = createSlider( document.getElementById( 'slider' ), options );
	[ 'change', 'settle' ].forEach( ( name ) =>
		window.slider.on( name, ( value ) => window.events.push( [ name, value ] ) )
	);
	window.ready = true;
</script>
</body>
</html>
