<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>shaderslide without a script of one's own</title>
<script>
	// ?from=dist tests what is built for the pages of others.
	window.from = new URLSearchParams( location.search ).get( 'from' ) || 'src';
	window.made = [];
	document.addEventListener( 'ss:ready', ( event ) =>
		window.made.push( event.target.id )
	);
	document.write(
		`<link rel="stylesheet" href="../${ window.from }/style.css">` +
			`<link rel="stylesheet" href="../${ window.from }/lightbox.css">` +
			`<script type="module" src="../${ window.from }/auto.js"><\/script>`
	);
</script>
<style>
	body { margin: 0; }
	.ss { width: 800px; margin: 40px 100px; }
	.ss-slide { height: 300px; }
</style>
</head>
<body>
<div class="ss" id="plain" aria-label="Plain" data-ss>
	<div class="ss-track">
		<div class="ss-slide"><img class="ss-media" src="../demo/media/1.jpg" alt="One"></div>
		<div class="ss-slide"><img class="ss-media" src="../demo/media/2.jpg" alt="Two"></div>
		<div class="ss-slide"><img class="ss-media" src="../demo/media/3.jpg" alt="Three"></div>
	</div>
	<button data-ss-next>Next</button>
</div>
<div class="ss" id="drawn" aria-label="Drawn" data-ss='{ "loop": true, "start": 1 }'
	data-ss-canvas='{ "stretch": { "amount": 2 }, "nothing": {} }' data-ss-lightbox="stretch">
	<div class="ss-track">
		<div class="ss-slide"><img class="ss-media" src="../demo/media/4.jpg" alt="Four"></div>
		<div class="ss-slide"><img class="ss-media" src="../demo/media/5.jpg" alt="Five"></div>
		<div class="ss-slide"><img class="ss-media" src="../demo/media/6.jpg" alt="Six"></div>
	</div>
</div>
<div id="later"></div>
</body>
</html>
