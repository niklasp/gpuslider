<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tape · shaderslide</title>
<meta name="description" content="Rows of pictures that run by themselves, and faster when the page is scrolled.">
<link rel="stylesheet" href="../../src/style.css">
<link rel="stylesheet" href="../../src/loading.css">
<link rel="stylesheet" href="tape.css">
<noscript><style>.ss-loading { display: none; }</style></noscript>
</head>
<body>

<header>
	<a href="../">shaderslide</a>
	<span id="said">Scroll</span>
</header>

<h1>Nothing<br>stands<br>still</h1>

<p class="word" aria-hidden="true">Film</p>
<div class="ss tape" aria-label="Film: a row of pictures" data-way="1">
	<div class="ss-track">
		<div class="ss-slide"><img class="ss-media" src="../wall/media/01.jpg" width="840" height="560" alt="Picture 1 of 24"></div>
		<div class="ss-slide"><img class="ss-media" src="../wall/media/06.jpg" width="840" height="560" alt="Picture 6 of 24"></div>
		<div class="ss-slide"><img class="ss-media" src="../wall/media/11.jpg" width="840" height="560" alt="Picture 11 of 24"></div>
		<div class="ss-slide"><img class="ss-media" src="../wall/media/16.jpg" width="840" height="560" alt="Picture 16 of 24"></div>
		<div class="ss-slide"><img class="ss-media" src="../wall/media/21.jpg" width="840" height="560" alt="Picture 21 of 24"></div>
		<div class="ss-slide"><img class="ss-media" src="../wall/media/02.jpg" width="840" height="560" alt="Picture 2 of 24"></div>
		<div class="ss-slide"><img class="ss-media" src="../wall/media/07.jpg" width="840" height="560" alt="Picture 7 of 24"></div>
		<div class="ss-slide"><img class="ss-media" src="../wall/media/12.jpg" width="840" height="560" alt="Picture 12 of 24"></div>
	</div>
</div>
<p class="word" aria-hidden="true">Field</p>
<div class="ss tape" aria-label="Field: a row of pictures" data-way="-1">
	<div class="ss-track">
		<div class="ss-slide"><img class="ss-media" src="../wall/media/07.jpg" width="840" height="560" alt="Picture 7 of 24"></div>
		<div class="ss-slide"><img class="ss-media" src="../wall/media/12.jpg" width="840" height="560" alt="Picture 12 of 24"></div>
		<div class="ss-slide"><img class="ss-media" src="../wall/media/17.jpg" width="840" height="560" alt="Picture 17 of 24"></div>
		<div class="ss-slide"><img class="ss-media" src="../wall/media/22.jpg" width="840" height="560" alt="Picture 22 of 24"></div>
		<div class="ss-slide"><img class="ss-media" src="../wall/media/03.jpg" width="840" height="560" alt="Picture 3 of 24"></div>
		<div class="ss-slide"><img class="ss-media" src="../wall/media/08.jpg" width="840" height="560" alt="Picture 8 of 24"></div>
		<div class="ss-slide"><img class="ss-media" src="../wall/media/13.jpg" width="840" height="560" alt="Picture 13 of 24"></div>
		<div class="ss-slide"><img class="ss-media" src="../wall/media/18.jpg" width="840" height="560" alt="Picture 18 of 24"></div>
	</div>
</div>
<p class="word" aria-hidden="true">Sound</p>
<div class="ss tape" aria-label="Sound: a row of pictures" data-way="1">
	<div class="ss-track">
		<div class="ss-slide"><img class="ss-media" src="../wall/media/13.jpg" width="840" height="560" alt="Picture 13 of 24"></div>
		<div class="ss-slide"><img class="ss-media" src="../wall/media/18.jpg" width="840" height="560" alt="Picture 18 of 24"></div>
		<div class="ss-slide"><img class="ss-media" src="../wall/media/23.jpg" width="840" height="560" alt="Picture 23 of 24"></div>
		<div class="ss-slide"><img class="ss-media" src="../wall/media/04.jpg" width="840" height="560" alt="Picture 4 of 24"></div>
		<div class="ss-slide"><img class="ss-media" src="../wall/media/09.jpg" width="840" height="560" alt="Picture 9 of 24"></div>
		<div class="ss-slide"><img class="ss-media" src="../wall/media/14.jpg" width="840" height="560" alt="Picture 14 of 24"></div>
		<div class="ss-slide"><img class="ss-media" src="../wall/media/19.jpg" width="840" height="560" alt="Picture 19 of 24"></div>
		<div class="ss-slide"><img class="ss-media" src="../wall/media/24.jpg" width="840" height="560" alt="Picture 24 of 24"></div>
	</div>
</div>
<p class="word" aria-hidden="true">Print</p>
<div class="ss tape" aria-label="Print: a row of pictures" data-way="-1">
	<div class="ss-track">
		<div class="ss-slide"><img class="ss-media" src="../wall/media/19.jpg" width="840" height="560" alt="Picture 19 of 24"></div>
		<div class="ss-slide"><img class="ss-media" src="../wall/media/24.jpg" width="840" height="560" alt="Picture 24 of 24"></div>
		<div class="ss-slide"><img class="ss-media" src="../wall/media/05.jpg" width="840" height="560" alt="Picture 5 of 24"></div>
		<div class="ss-slide"><img class="ss-media" src="../wall/media/10.jpg" width="840" height="560" alt="Picture 10 of 24"></div>
		<div class="ss-slide"><img class="ss-media" src="../wall/media/15.jpg" width="840" height="560" alt="Picture 15 of 24"></div>
		<div class="ss-slide"><img class="ss-media" src="../wall/media/20.jpg" width="840" height="560" alt="Picture 20 of 24"></div>
		<div class="ss-slide"><img class="ss-media" src="../wall/media/01.jpg" width="840" height="560" alt="Picture 1 of 24"></div>
		<div class="ss-slide"><img class="ss-media" src="../wall/media/06.jpg" width="840" height="560" alt="Picture 6 of 24"></div>
	</div>
</div>

<p class="end">The rows run by themselves, slower under the pointer. The page that is scrolled pushes them, and what is pushed gives way.</p>

<script type="module" src="tape.js"></script>
</body>
</html>
